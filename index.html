<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Haven - Residence & Outage Portal</title>
    <meta name="description" content="Bilingual & trilingual residential building management and tenant outage communication portal for Algeria and North Africa, featuring standalone Resident and Manager apps." />
    <meta property="og:title" content="Haven - Residence & Outage Portal" />
    <meta property="og:description" content="Bilingual & trilingual residential building management and tenant outage communication portal for Algeria and North Africa, featuring standalone Resident and Manager apps." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#10B981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-elevate-bg dark:bg-elevate-bg-dark text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white min-h-screen transition-colors duration-300">
    <!-- Startup loading fallback: shown while React initializes, or if JS crashes -->
    <div id="startup-fallback" style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;font-family:Inter,system-ui,-apple-system,sans-serif;background:#F8FAFC;color:#0F172A;">
      <div style="width:48px;height:48px;border:3px solid #E2E8F0;border-top-color:#10B981;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;"></div>
      <p style="font-size:14px;font-weight:500;color:#64748B;">Chargement de Haven…</p>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        console.error('[Haven] Global error:', event.error || event.message);
        var fallback = document.getElementById('startup-fallback');
        var root = document.getElementById('root');
        if (fallback) {
          fallback.innerHTML = '<div style="padding:24px;text-align:center;font-family:Inter,system-ui,sans-serif;"><p style="font-size:48px;">⚠️</p><h2 style="font-size:18px;font-weight:700;">Erreur de chargement</h2><p style="color:#64748B;font-size:13px;margin:8px 0 16px;">' + (event.message || 'Le module principal n\'a pas pu être chargé.') + '</p><button onclick="location.reload()" style="background:#10B981;color:#FFF;border:none;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;">Réessayer</button></div>';
          fallback.style.display = 'flex';
          fallback.style.animation = 'none';
        }
        if (root) root.style.display = 'none';
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.error('[Haven] Promise rejection:', event.reason);
      });
    </script>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif;padding:24px;text-align:center;">
        <div>
          <p style="font-size:48px;">🚫</p>
          <h2 style="font-size:18px;font-weight:700;">JavaScript requis</h2>
          <p style="color:#64748B;font-size:13px;">Haven nécessite JavaScript pour fonctionner.</p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
