name: Build Android APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-apks:
    name: Build Resident and Manager APKs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x ./gradlew

      # --- 1. RESIDENT APP BUILD ---
      - name: Sync Resident App to Android
        run: npm run android:sync:resident

      - name: Build Resident APK (Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Rename Resident APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk haven-resident-app.apk

      # --- 2. MANAGER APP BUILD ---
      - name: Clean previous Android build
        working-directory: ./android
        run: ./gradlew clean

      - name: Sync Manager App to Android
        run: npm run android:sync:manager

      - name: Build Manager APK (Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Rename Manager APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk haven-manager-app.apk

      # --- 3. UPLOAD ARTIFACTS ---
      - name: Upload APKs to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: haven-android-apks
          path: |
            haven-resident-app.apk
            haven-manager-app.apk
          retention-days: 7
